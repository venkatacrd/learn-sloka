[project]
name = "recite-coach"
version = "0.1.0"
description = "Record a sloka recitation and get pronunciation feedback, offline (feature 004)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "indic-transliteration>=2.3",
    "miniaudio>=1.59",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "typer>=0.12",
]

[project.scripts]
recite-check = "recite_coach.cli:check_app"
recite-setup = "recite_coach.cli:setup_app"
recite-serve = "recite_coach.cli:serve_app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recite_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["model: needs the downloaded model (recite-setup)", "e2e: needs repo audio/text outputs"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["miniaudio.*", "onnxruntime.*", "indic_transliteration.*"]
ignore_missing_imports = true

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.html" }]
