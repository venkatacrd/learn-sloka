[project]
name = "sanskrit-extract"
version = "0.1.0"
description = "Extract Devanagari slokas from PDFs into JSONL units (feature 001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "typer>=0.12",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.9", "numpy>=1.26"]

[project.scripts]
sanskrit-extract = "sanskrit_extract.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "jsonschema>=4.21",
    "pytest-socket>=0.7",
    "rapidfuzz>=3.6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanskrit_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "ocr: needs a local Tesseract install with san+hin models",
    "slow: performance benchmarks",
    "gold: needs gold text in samples/gold/",
]
addopts = "-q -m \"not slow\""
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # Devanagari look-alikes intended; B008 = Typer idiom

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "pytesseract", "cv2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sanskrit_extract.pdf_reader"]
disallow_untyped_calls = false  # PyMuPDF ships without full type hints

[tool.uv]
# Reinstall the package whenever the source changes (needed for non-editable installs, see README).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
