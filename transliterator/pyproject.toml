[project]
name = "sanskrit-romanize"
version = "0.1.0"
description = "Romanize extracted Devanagari units to IAST, losslessly (feature 002)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "indic-transliteration>=2.3",
    "jsonschema>=4.21",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
crosscheck = ["aksharamukha>=2.1"]

[project.scripts]
sanskrit-romanize = "sanskrit_romanize.cli:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanskrit_romanize"]

[tool.hatch.build.targets.wheel.force-include]
"../specs/contracts" = "sanskrit_romanize/contracts"  # NFR-TR-05: depend on the contract files only

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m \"not slow\""
markers = ["slow: benchmarks", "e2e: needs the pdf-extractor project next to this one"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["indic_transliteration.*", "aksharamukha.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "../specs/contracts/*.json" }]
