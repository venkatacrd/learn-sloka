[project]
name = "sloka-split"
version = "0.1.0"
description = "Split a chanted recitation MP3 into one file per sloka, losslessly (feature 003)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "miniaudio>=1.59",
    "mutagen>=1.47",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.scripts]
sloka-split = "sloka_split.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "lameenc>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sloka_split"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["e2e: needs the reference recording next to this project"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["miniaudio.*", "mutagen.*"]
ignore_missing_imports = true

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[[tool.mypy.overrides]]
module = ["sloka_split.splitter"]
disallow_untyped_calls = false  # mutagen ships no type hints
